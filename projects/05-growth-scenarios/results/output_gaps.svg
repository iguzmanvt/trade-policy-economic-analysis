<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600" role="img" aria-labelledby="title desc">
<title id="title">Illustrative output per worker gaps relative to baseline</title>
<desc id="desc">Four exact Solow model paths over fifty years; values are percentage gaps relative to the same-year baseline. These are hypothetical scenarios, not forecasts.</desc>
<rect width="1060" height="600" fill="white"/>
<g font-family="Arial, sans-serif" fill="#222222">
<text x="85" y="35" font-size="23" font-weight="bold">Investment and efficiency affect different horizons</text>
<text x="85" y="61" font-size="15">Output per worker: percent gap relative to the same-year baseline</text>
<line x1="85" x2="115" y1="90" y2="90" stroke="#333333" stroke-width="2.7" stroke-dasharray="6 4"/>
<text x="123" y="95" font-size="14">Baseline</text>
<line x1="255" x2="285" y1="90" y2="90" stroke="#002060" stroke-width="2.7"/>
<text x="293" y="95" font-size="14">Higher investment</text>
<line x1="490" x2="520" y1="90" y2="90" stroke="#a8750d" stroke-width="2.7" stroke-dasharray="9 3"/>
<text x="528" y="95" font-size="14">Faster efficiency growth</text>
<line x1="785" x2="815" y1="90" y2="90" stroke="#8d4259" stroke-width="2.7" stroke-dasharray="3 3"/>
<text x="823" y="95" font-size="14">Both changes</text>
<line x1="85" x2="1000" y1="485.0" y2="485.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="490.0" text-anchor="end" font-size="14">-5%</text>
<line x1="85" x2="1000" y1="440.0" y2="440.0" stroke="#aaa" stroke-width="1"/>
<text x="73" y="445.0" text-anchor="end" font-size="14">0%</text>
<line x1="85" x2="1000" y1="395.0" y2="395.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="400.0" text-anchor="end" font-size="14">5%</text>
<line x1="85" x2="1000" y1="350.0" y2="350.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="355.0" text-anchor="end" font-size="14">10%</text>
<line x1="85" x2="1000" y1="305.0" y2="305.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="310.0" text-anchor="end" font-size="14">15%</text>
<line x1="85" x2="1000" y1="260.0" y2="260.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="265.0" text-anchor="end" font-size="14">20%</text>
<line x1="85" x2="1000" y1="215.0" y2="215.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="220.0" text-anchor="end" font-size="14">25%</text>
<line x1="85" x2="1000" y1="170.0" y2="170.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="175.0" text-anchor="end" font-size="14">30%</text>
<line x1="85" x2="1000" y1="125.0" y2="125.0" stroke="#e9e9e9" stroke-width="1"/>
<text x="73" y="130.0" text-anchor="end" font-size="14">35%</text>
<line x1="85.0" x2="85.0" y1="485" y2="490" stroke="#444"/>
<text x="85.0" y="512" text-anchor="middle" font-size="14">0</text>
<line x1="268.0" x2="268.0" y1="485" y2="490" stroke="#444"/>
