<line x1="817.0" x2="817.0" y1="485" y2="490" stroke="#444"/>
<text x="817.0" y="512" text-anchor="middle" font-size="14">40</text>
<line x1="1000.0" x2="1000.0" y1="485" y2="490" stroke="#444"/>
<text x="1000.0" y="512" text-anchor="middle" font-size="14">50</text>
